name: moventra
description: MOVENTRA - Train. Recover. Return Stronger.
publish_to: 'none'
version: 0.3.0+3

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  model_viewer_plus: ^1.10.0
  shared_preferences: ^2.5.3
  video_player: ^2.10.0
  camera: ^0.11.2
  google_mlkit_pose_detection: ^0.16.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/human.glb
    - assets/exercises/
    - assets/design/
