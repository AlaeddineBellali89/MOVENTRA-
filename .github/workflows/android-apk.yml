name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android .

      - name: Configure Android for 3D and Camera
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' android/app/build.gradle.kts
          fi

          if [ -f android/app/build.gradle ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' android/app/build.gradle
          fi

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          if 'android.permission.CAMERA' not in s:
              pos = s.find('>') + 1
              s = (
                  s[:pos]
                  + '\n    <uses-permission android:name="android.permission.CAMERA" />'
                  + s[pos:]
              )

          if 'android:usesCleartextTraffic=' not in s:
              s = s.replace(
                  '<application',
                  '<application android:usesCleartextTraffic="true"',
                  1
              )

          p.write_text(s)
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MOVENTRA-COMPLETE-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
